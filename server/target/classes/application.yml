server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fault_ticket?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: fault-ticket-system-jwt-secret-key-2026-must-be-long-enough
  expiration: 86400000  # 24小时（毫秒）
